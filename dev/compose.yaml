# Local test instances for Public Share Control.
#
#   docker compose -f dev/compose.yaml up -d
#   dev/setup.sh            # enable the app, create test share + public link
#
# The repository itself is bind-mounted as the app, so after `npm run build`
# changes are live on the next page load in both instances.

x-nextcloud: &nextcloud
  restart: unless-stopped
  environment: &env
    SQLITE_DATABASE: nextcloud
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: Admin1234!
    NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1

services:
  nc34:
    <<: *nextcloud
    image: nextcloud:34
    container_name: pscontrol-nc34
    ports:
      - "127.0.0.1:8034:80"
    volumes:
      - nc34_html:/var/www/html
      - ..:/var/www/html/custom_apps/public_share_control:ro

  nc35:
    <<: *nextcloud
    image: nextcloud:35
    container_name: pscontrol-nc35
    ports:
      - "127.0.0.1:8035:80"
    volumes:
      - nc35_html:/var/www/html
      - ..:/var/www/html/custom_apps/public_share_control:ro

volumes:
  nc34_html:
  nc35_html:
